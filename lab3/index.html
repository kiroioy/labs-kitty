<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sanrio Characters</title>
    <!-- подключение библиотеки bootstrap (локально или через CDN при открытии на GitHub Pages) -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css';">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Comfortaa', cursive, sans-serif;
            background-color: #fff0f5;
            color: #2d2a26;
        }

        /* основные кнопки */
        .btn-sanrio {
            background-color: #ff3366;
            color: #ffffff;
            border: 1.5px solid #ff3366;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .btn-sanrio:hover {
            background-color: #e84f6c;
        }

        /* контурная кнопка */
        .btn-outline-sanrio {
            background-color: transparent;
            color: #ff3366;
            border: 1.5px solid #ff3366;
            border-radius: 12px;
        }
        .btn-outline-sanrio:hover {
            background-color: #ff3366;
            color: #ffffff;
        }

        /* карточка */
        .card-sanrio {
            border: 1px solid #ffd1dc;
            border-radius: 16px;
        }
    
        /* подложка под картинку */
        .card-img-wrapper {
            background-color: #fff0f5;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        /* рамки */
        .border-sanrio {
            border-color: #ffd1dc !important;
        }

        /* уведомление */
        .alert-sanrio {
            background-color: #e8f4fd;
            border: 1px solid #bce1f7;
            color: #2098d1;
            border-radius: 12px;
        }
        .btn-sanrio-blue {
            border: 1.5px solid #2098d1;
            color: #2098d1;
            background-color: #ffffff;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            padding: 6px 14px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-sanrio-blue:hover {
            background-color: #2098d1;
            color: #ffffff;
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js';"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
