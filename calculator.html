<!DOCTYPE html>
<html>
<head>
  <title>Калькулятор Hello Kitty</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
   <!-- верхняя строчка -->
    <div class="top-utility">
    <div class="utility-left">
      <span>Подарки с персонажами</span>
      <span>Кафе Hello Kitty</span>
    </div>
    <div class="utility-right">
      <span>Список желаний ♡</span>
      <span>Мой аккаунт</span>
      <span>Корзина</span>
    </div>
  </div>
  <!--главная шапка-->
  <header class="main-header">
    <div class="logo">
      <a href="index.html">
        <img src="logo-sanrio.avif" alt="Sanrio Logo">
      </a>
    </div>
    <!--блок с пунктами меню-->
    <div class="nav-container">
      <nav class="nav-menu">
        <a href="#">НОВИНКИ</a>
        <a href="#">КОЛЛАБОРАЦИИ</a>
        <a href="#">ПЕРСОНАЖИ</a>
        <a href="#">ОДЕЖДА</a>
        <!-- Кнопка перехода в калькулятор -->
        <a href="calculator.html" class="nav-calc-link">★ КАЛЬКУЛЯТОР ★</a>
        <a href="#">СКИДКИ</a>
      </nav>
      <div class="search-box">
        <input type="text" placeholder="Что вы ищете?">
      </div>
    </div>
  </header>
  <!--баннер с информацией-->
  <div class="announcement-bar">
    <span>🎀 Бесплатная доставка при заказе от 5000₽! 🎀</span>
  </div>
  <main class="calculator-container">
    <h2 class="calculator-title">СЧИТАЙ ВМЕСТЕ С HELLO KITTY</h2>
    <p class="calculator-p">Милый калькулятор Sanrio. Считай свои покупки и делись улыбками!</p>

    <div class="calculator"> <!--класс calculator, чтобы отделить -->
<!-- div - это базовый html-контейнер, который может содержать в себе другие html-элементы. -->
    
    <!-- блок с экраном калькулятора, где будет выводиться результат вычислений. -->
    <div id="result" class="result">
      0
    </div>

    <!-- блок с кнопками калькулятора. -->
    <div> 
      <!--горизонтальный ряд из четырех кнопок-->
      <div>  
        <button id="btn_op_clear" class="my-btn secondary">C</button>   
        <!-- <button id="btn_op_sign" class="my-btn secondary">+/-</button> -->
        <button id="btn_op_cashback" class="my-btn secondary" title="Кэшбэк 5% Sanrio">💖</button>

        <button id="btn_op_percent" class="my-btn secondary">%</button>
        <button id="btn_op_div" class="my-btn secondary">/</button>
      </div>

      <div>
        <button id="btn_digit_7" class="my-btn">7</button>
        <button id="btn_digit_8" class="my-btn">8</button>
        <button id="btn_digit_9" class="my-btn">9</button>
        <button id="btn_op_mult" class="my-btn secondary">x</button>
      </div>

      <div>
        <button id="btn_digit_4" class="my-btn">4</button>
        <button id="btn_digit_5" class="my-btn">5</button>
        <button id="btn_digit_6" class="my-btn">6</button>
        <button id="btn_op_minus" class="my-btn secondary">-</button>
      </div>

      <div>
        <button id="btn_digit_1" class="my-btn">1</button>
        <button id="btn_digit_2" class="my-btn">2</button>
        <button id="btn_digit_3" class="my-btn">3</button>
        <button id="btn_op_plus" class="my-btn secondary">+</button>
      </div>

      <div>
        <button id="btn_digit_0" class="my-btn">0</button>
        <button id="btn_digit_dot" class="my-btn">.</button>
        <button id="btn_op_equal" class="my-btn primary execute">=</button>
      </div>
    </div>
  </div>
  </main>
</body>
</html>
